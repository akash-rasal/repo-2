name: ETL pipeline 
on:
    push:
        branches:
            - main
jobs:
    job-1:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: print message
              run: echo "job1"
    job-2:  
        runs-on: ubuntu-latest
        needs: job-1
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: print message
              run: echo "job2"
    job-3:
        runs-on: ubuntu-latest
        needs: job-1
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: print message
              run: echo "job3"
    job-4:
        runs-on: ubuntu-latest  
        needs: job-2
        steps:  
            - name: checkout code 
              uses: actions/checkout@v2
            - name: print message
              run: echo "job4"
    job-5:
        runs-on: ubuntu-latest
        needs: job-3
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: print message
              run: echo "job5"
    job-6:
        runs-on: ubuntu-latest
        needs: [job-4, job-5]
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: print message
              run: echo "job6"